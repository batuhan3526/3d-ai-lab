[project]
name = "gateway"
version = "0.1.0"
description = "FastAPI gateway — auth, validation, job routing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "celery>=5.4",
    "redis>=5.0",
    # Ev/LAN çok-kullanıcı auth — bcrypt parola hash'i (passlib backend).
    # bcrypt<4.1 pinlendi: passlib 1.7.4, bcrypt 4.1+ ile uyumsuz (72-bayt hatası).
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",
    # 3D baskı hazırlama (Task E3): trimesh.fill_holes networkx'e ihtiyaç duyar
    # (delik-döngü tespiti). trimesh'in opsiyonel bağımlılığı; açıkça pinliyoruz.
    "networkx>=3.0",
    # Dikiş kalıbı (BATCH-G): xatlas mesh UV-unwrap (chart açımı), svglib+reportlab
    # SVG→A4-karo PDF. Ağır iş sınırlı threadpool'da koşar (print-prep deseni).
    "xatlas>=0.0.9",
    # Mesh decimation (view-mesh + sewing unfold). Eksikse büyük mesh decimate
    # edilmeden xatlas'a gider ve native çökme (segfault) olur.
    "fast-simplification>=0.1.7",
    # View-mesh doku yeniden-bake (T1): decimate+xatlas-reparametrize edilen
    # görüntüleme kopyasında orijinal dokuyu yeni UV düzenine örnekler. scipy
    # cKDTree (dünya-uzayı en-yakın örnek) + ndimage.distance_transform_edt
    # (gutter dilation). scipy zaten trimesh.proximity'nin zorunlu bağımlılığı.
    "scipy>=1.11",
    "svglib>=1.5",
    "reportlab>=4.0",
    "common",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fakeredis>=2.21",
    "ruff>=0.3",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
