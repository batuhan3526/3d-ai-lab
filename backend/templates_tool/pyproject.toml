[project]
name = "templates_tool"
version = "0.1.0"
description = "Prosedürel garment GLB üretimi + CC0 indirme overlay + manifest"
requires-python = ">=3.11"
dependencies = [
    "trimesh>=4.4",
    "numpy>=1.26",
    "httpx>=0.27",
    "common",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/templates_tool"]
