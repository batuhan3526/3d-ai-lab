[project]
name = "cloud-worker"
version = "0.1.0"
description = "Bulut API motorları (görsel + 3D) Celery worker — CPU-only, anahtarlar .env'den"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "pillow>=10",
    "numpy>=1.26",
    "trimesh>=4",
    "common",
]

[tool.uv.sources]
common = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "fakeredis>=2.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_worker"]
