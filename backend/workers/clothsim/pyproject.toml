[project]
name = "clothsim-worker"
version = "0.1.0"
description = "Offline kumaş simülasyonu (Blender headless drape) Celery worker — CPU-only"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.4",
    "redis>=5.0",
    "common",
]

[tool.uv.sources]
common = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "fakeredis>=2.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clothsim_worker"]
