[project]
name = "text-to-3d"
version = "0.1.0"
description = "Faz 2 text->3D Celery worker (M1: placeholder; M2+: Hunyuan3D)"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.4",
    "redis>=5.0",
    "trimesh>=4.12",
    "common",
    "gateway",
]

[tool.uv.sources]
common = { path = "../../common", editable = true }
gateway = { path = "../../gateway", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "fakeredis>=2.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_to_3d"]
