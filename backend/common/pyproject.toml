[project]
name = "common"
version = "0.1.0"
description = "Paylaşılan kod: config, logging, gpu_lock"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "celery>=5.4",
    "redis>=5.0",
]

[project.optional-dependencies]
# Offline TR→EN prompt translation (TRANSLATE_BACKEND=argos). Pulls torch — opt-in.
translate = [
    "argostranslate>=1.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "fakeredis>=2.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
